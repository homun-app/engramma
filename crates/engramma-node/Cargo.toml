[package]
name = "engramma-node"
description = "Node.js (N-API) binding of the Engramma memory engine, for Homun"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
engramma-core.workspace = true
engramma-embed.workspace = true
engramma-vault.workspace = true
serde_json.workspace = true
time.workspace = true
ulid.workspace = true
napi.workspace = true
napi-derive.workspace = true

# v0.4.4 (P1) → v0.4.5 (P2): in a cdylib the #[global_allocator] covers
# THIS module's Rust allocations (engine + tract); Node/Electron keep
# their own. macOS only — on Linux glibc returns the freed pages and
# mimalloc does not (REPORT v0.4.5).
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[build-dependencies]
napi-build.workspace = true

