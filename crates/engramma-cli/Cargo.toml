[package]
name = "engramma-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "engramma"
path = "src/main.rs"

[dependencies]
engramma-embed.workspace = true
engramma-core.workspace = true
engramma-vault.workspace = true
engramma-mcp = { path = "../engramma-mcp", version = "0.1.0-dev" }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
time.workspace = true
ulid.workspace = true
tokio.workspace = true

# v0.4.4 (P1) → v0.4.5 (P2): the executable chooses the allocator, per
# platform (see the workspace entry): mimalloc on macOS only — on Linux
# glibc returns the freed pages and mimalloc does not (REPORT v0.4.5).
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
tempfile.workspace = true
