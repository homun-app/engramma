[package]
name = "engramma-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# v0.6.17 (F2): dist wants the repository URL on the distributed package
repository.workspace = true

[[bin]]
name = "engramma"
path = "src/main.rs"

[dependencies]
engramma-embed.workspace = true
engramma-core.workspace = true
engramma-sync.workspace = true
engramma-vault.workspace = true
engramma-mcp = { path = "../engramma-mcp", version = "0.6.20-beta.1" }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
time.workspace = true
ulid.workspace = true
tokio.workspace = true
tokio-util = "0.7"
axum.workspace = true
# v0.5 (P5): the review page — the session/CSRF tokens (blake3, ring: both
# already in the lock) and the form decoding (serde)
blake3.workspace = true
ring.workspace = true
serde.workspace = true

# v0.4.4 (P1) → v0.4.5 (P2): the executable chooses the allocator, per
# platform (see the workspace entry): mimalloc on macOS only — on Linux
# glibc returns the freed pages and mimalloc does not (REPORT v0.4.5).
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# v0.6.1 (P3): the sync tests write a root's address book by hand
rusqlite.workspace = true
# v0.6.1 (C1): the relay-ticket tests run iroh's LOCAL relay and decode
# the ticket — the binary variant that trusts it is built by the test
# itself with the `test-relay` feature (never default)
engramma-sync.workspace = true
iroh = { workspace = true, features = ["test-utils"] }
# v0.5 (P5): the review-page tests speak HTTP; ureq is already in the lock
ureq.workspace = true

[features]
# v0.6.1 (C1): ONLY the relay-ticket tests build the binary with this —
# it lets the CLI trust iroh's LOCAL relay (self-signed certificate).
# Never default, never in the production binary (the reviewer verified
# test-utils stays out; a test asserts the default build does not have it).
test-relay = ["engramma-sync/test-utils"]
