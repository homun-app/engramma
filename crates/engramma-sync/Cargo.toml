[package]
name = "engramma-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# v0.6: sync of a cell's change log between the owner's devices.
# Dependencies only, for now: the phase builds the crate.
[dependencies]
engramma-core.workspace = true
iroh.workspace = true
negentropy.workspace = true
spake2.workspace = true
hpke.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
x25519-dalek = "3"
getrandom = "0.4"
time.workspace = true
base64ct = "1"
hkdf.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# v0.6.2 (S1): the serve loop's stop token. Already in the lock (the CLI
# used it): declaring it here adds no crate.
tokio-util = "0.7"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ulid.workspace = true
blake3.workspace = true
rusqlite.workspace = true

# v0.6.2 (S1): the exclusive root lock (`<root>/sync.lock`) is flock, via
# libc — already in the lock (iroh, tokio): no new crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# a local iroh relay server for the tests (offline, loopback only)
iroh = { workspace = true, features = ["test-utils"] }
# the self dev-dependency turns this crate's own `test-utils` feature on in
# test builds: the local relay's certificate is self-signed, and iroh gates
# the verifier that trusts it behind that feature
engramma-sync = { path = ".", features = ["test-utils"] }
tempfile.workspace = true
proptest.workspace = true

[features]
# forwards to iroh's test-utils: the local relay of the tests
test-utils = ["iroh/test-utils"]

# v0.6.17 (F2): not a distributed package — only engramma-cli ships
[package.metadata.dist]
dist = false
