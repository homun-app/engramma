[package]
name = "engramma-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "engramma-bench"
path = "src/main.rs"

[dependencies]
engramma-embed.workspace = true
engramma-core.workspace = true
ulid.workspace = true
time.workspace = true
serde_json.workspace = true
# v0.4.4 (P3): the longmemeval example checks the dataset sha256 with the
# digest crate already in the tree (rustls, via ureq) and indexes the
# vector cache by sha256 of the round text.
ring.workspace = true
serde.workspace = true

[dev-dependencies]
# the longmemeval example builds its one-cell-per-question tree in a
# tempdir, gone at the end of the run
tempfile.workspace = true
# the profile_put example arms the REAL device signer (K4): the sync era's
# Ed25519 cost, not a mock of it
engramma-sync.workspace = true

# v0.6.17 (F2): not a distributed package — only engramma-cli ships
[package.metadata.dist]
dist = false
