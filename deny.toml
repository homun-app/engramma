# cargo-deny configuration. Advisory checks need the network and are skipped
# in this project's offline CI (`cargo deny check licenses bans` only).

# v0.6: only the platforms engramma ships on. iroh carries wasm-only
# dependencies (ws_stream_wasm and friends, under the Unlicense) that never
# build for these targets.
[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]
# Unused allowances are fine (they document the policy); the current tree
# happens not to need ISC, MPL-2.0 or Unicode-DFS-2016.
confidence-threshold = 0.93
# Mozilla's CA root bundle (data, not code) under a permissive data licence,
# pulled by ureq for TLS to external embedding endpoints (v0.2), and the
# same bundle as certificates by iroh's relay client (v0.6). Allowed for
# these crates only.
exceptions = [
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
  { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
# Duplicated versions are tolerated (the resolver already minimises them);
# outright duplicates of security-sensitive crates would be flagged here.
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
