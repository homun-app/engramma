# cargo-deny configuration. The CI runs `licenses bans` and `advisories`
# (both blocking, since v0.6.16): a new advisory stops the next push until
# it is fixed by an update or silenced here with a reasoned `ignore`.

# v0.6: only the platforms engramma ships on. iroh carries wasm-only
# dependencies (ws_stream_wasm and friends, under the Unlicense) that never
# build for these targets.
[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "warn"
# Every entry is a standing decision with its own reason, dated. A NEW
# advisory (one not listed here) fails the check and blocks the push.
ignore = [
  # RUSTSEC-2026-0592, url 2.5.8 (2026-11-24): stack overflow in
  # `Url::origin()` on deeply nested `blob:` URLs. No fixed release is
  # published (`cargo update -p url` keeps 2.5.8), and crates/*/src never
  # calls `Url::origin()` (grep, 2026-11-24) — the affected entry point has
  # no caller here. Revisit when the fix ships: the ignore goes, the check
  # stays.
  "RUSTSEC-2026-0592",
  # RUSTSEC-2024-0436, paste unmaintained (2026-11-24): pulled in by
  # `tokenizers` <- `engramma-embed` (cargo tree -i, macro-only crate).
  # Replacing it is a phase of its own (declared out of v0.6.16).
  "RUSTSEC-2024-0436",
  # RUSTSEC-2026-0543, chrono unmaintained (2026-11-24): pulled in by
  # `rmcp` and `schemars` (MCP) and by `tokio-rustls-acme` <- `iroh-relay`
  # <- `iroh` <- `engramma-sync` (cargo tree -i). Replacing it is a phase
  # of its own (declared out of v0.6.16).
  "RUSTSEC-2026-0543",
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]
# Unused allowances are fine (they document the policy); the current tree
# happens not to need ISC, MPL-2.0 or Unicode-DFS-2016.
confidence-threshold = 0.93
# Mozilla's CA root bundle (data, not code) under a permissive data licence,
# pulled by ureq for TLS to external embedding endpoints (v0.2), and the
# same bundle as certificates by iroh's relay client (v0.6). Allowed for
# these crates only.
exceptions = [
  { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
  { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
# Duplicated versions are tolerated (the resolver already minimises them);
# outright duplicates of security-sensitive crates would be flagged here.
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
