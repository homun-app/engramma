[workspace]
resolver = "2"
members = ["crates/engramma-core", "crates/engramma-cli", "crates/engramma-mcp", "bench"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/homun-app/engramma"

[workspace.dependencies]
engramma-core = { path = "crates/engramma-core", version = "0.1.0-dev" }
rusqlite = { version = "0.41", features = ["bundled"] }
saphyr = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "3"
blake3 = "1"
rust-stemmers = "1.2"
whatlang = "0.18"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.8", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1"
proptest = "1"
tempfile = "3"
