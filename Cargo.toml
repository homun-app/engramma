# v0.4.4 (P0): the debug info of the dependencies was the bulk of a build
# (tract's rlib alone ~170 MB). Our crates keep file:line backtraces
# (`line-tables-only`); dependencies get none — nobody steps into them.
[profile.dev]
debug = "line-tables-only"

# v0.6.3 (C4): the `.node` artifact builds UNSTRIPPED. Cargo's release
# default is `strip = "debuginfo"`, and rustc's `strip -S` (Xcode 27.2)
# mis-aligns the LINKEDIT string pool of this dylib: dyld refuses the
# whole artifact («mis-aligned LINKEDIT string pool» — the v0.6.2
# `arc4random` parity trick only hid it). `npm run build` loads the
# artifact right after linking, so a toolchain that breaks it again
# fails the build.
[profile.release.package.engramma-node]
strip = "none"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[profile.dev.package."*"]
debug = false

[workspace]
resolver = "2"
members = ["crates/engramma-core", "crates/engramma-embed", "crates/engramma-vault", "crates/engramma-cli", "crates/engramma-mcp", "crates/engramma-node", "crates/engramma-sync", "bench"]

[workspace.package]
version = "0.6.18-beta.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/homun-app/engramma"

[workspace.dependencies]
engramma-core = { path = "crates/engramma-core", version = "0.6.18-beta.1" }
engramma-embed = { path = "crates/engramma-embed", version = "0.6.18-beta.1" }
engramma-vault = { path = "crates/engramma-vault", version = "0.6.18-beta.1" }
engramma-sync = { path = "crates/engramma-sync", version = "0.6.18-beta.1" }
# `hooks`: query-progress callback, used by the bounded-walk tests; `backup`:
# the compaction verify restores a snapshot into memory (no new crates: the
# features only compile more of rusqlite itself).
rusqlite = { version = "0.41", features = ["bundled", "hooks", "backup"] }
saphyr = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "3"
blake3 = "1"
rust-stemmers = "1.2"
whatlang = "0.18"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.8", features = ["server", "transport-io", "macros", "elicitation", "transport-streamable-http-server"] }
# v0.5: the local review page (`engramma review`, 127.0.0.1 only) — and,
# later, the HTTP MCP transport and `engramma serve`, which mount on the
# same stack (rmcp's HTTP server is a tower service).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal"] }
schemars = "1"
proptest = "1"
tempfile = "3"
# v0.2 embedding (verified 2026-11-05: tract gives the same vectors as ONNX
# Runtime on Granite R2, cos 1.000000; pure Rust, no native runtime to ship).
tract-onnx = "0.23.10"
# v0.4 Node binding for Homun (verified 2026-11-08: a napi-rs 3 addon with a
# class and an AsyncTask loads in Node 24 and in Homun's Electron 45, N-API 10).
napi = { version = "3.16.1", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
napi-build = "2"
# `fancy-regex` instead of the default `onig`: no C code, same token ids.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
# Ollama and external OpenAI-compatible embedding endpoints.
ureq = { version = "3.5", features = ["json"] }
# v0.3 markdown view: filesystem events as a hint for the scan-based sync.
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
# sha256 of model files: ring is already in the tree (rustls, via ureq), so
# declaring it here adds no new crate to Cargo.lock.
ring = "0.17"
# v0.4.4 (P1): the allocator of the two final artifacts (the `.node` and
# the CLI binary). The system allocator of macOS keeps the freed
# intermediate copies of the model load resident (~1.3 GB); mimalloc
# returns them. NOT for the libraries: whoever produces the executable
# chooses its allocator.
mimalloc = "0.1.39"

# v0.6: sync between the owner's devices (verified 2026-11-13).
# iroh 1.x (stable since 2026-06-15, MIT/Apache): QUIC dialed by Ed25519
# key, hole punching inside QUIC, stateless relays that see only
# ciphertext. ring TLS (already in the tree), no metrics.
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "portmapper", "fast-apple-datapath"] }
# Range-based set reconciliation (Meyer 2023; NIP-77): exchange only the
# missing op ids, cost proportional to the difference.
negentropy = "0.5"
# Pairing with a short code (PAKE, RFC 9382 — the magic-wormhole pattern).
spake2 = "0.4"
# RFC 9180: the cell key wrapped for each device (X25519, HKDF-SHA256,
# ChaCha20-Poly1305).
hpke = "0.15"
# Ops sealed end to end (XChaCha20-Poly1305: 192-bit random nonces) and
# signed by their author device.
chacha20poly1305 = "0.11"
ed25519-dalek = "3"
hkdf = "0.13"
sha2 = "0.11"
