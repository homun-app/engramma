[workspace]
resolver = "2"
members = ["crates/engramma-core", "crates/engramma-embed", "crates/engramma-vault", "crates/engramma-cli", "crates/engramma-mcp", "bench"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/homun-app/engramma"

[workspace.dependencies]
engramma-core = { path = "crates/engramma-core", version = "0.1.0-dev" }
engramma-embed = { path = "crates/engramma-embed", version = "0.1.0-dev" }
engramma-vault = { path = "crates/engramma-vault", version = "0.1.0-dev" }
# `hooks`: query-progress callback, used by the bounded-walk tests (no new
# crates: the feature only compiles more of rusqlite itself).
rusqlite = { version = "0.41", features = ["bundled", "hooks"] }
saphyr = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "3"
blake3 = "1"
rust-stemmers = "1.2"
whatlang = "0.18"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.8", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1"
proptest = "1"
tempfile = "3"
# v0.2 embedding (verified 2026-11-05: tract gives the same vectors as ONNX
# Runtime on Granite R2, cos 1.000000; pure Rust, no native runtime to ship).
tract-onnx = "0.23.10"
# `fancy-regex` instead of the default `onig`: no C code, same token ids.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
# Ollama and external OpenAI-compatible embedding endpoints.
ureq = { version = "3.5", features = ["json"] }
# v0.3 markdown view: filesystem events as a hint for the scan-based sync.
notify = "8.2.1"
notify-debouncer-full = "0.7.0"
# sha256 of model files: ring is already in the tree (rustls, via ureq), so
# declaring it here adds no new crate to Cargo.lock.
ring = "0.17"
